name: Update EMCLOUD rankings

on:
  schedule:
    # Saturday at 02:00 UTC
    - cron: "0 2 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-emcloud-csv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ranking script
        run: uv run python download_rank.py

      - name: Commit and push emcloud.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add emcloud.csv
          if git diff --staged --quiet; then
            echo "emcloud.csv is unchanged"
            exit 0
          fi
          git commit -m "chore: update emcloud rankings"
          git push origin HEAD:main
